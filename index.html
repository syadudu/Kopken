<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk | Kopi Kenangan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page-wrapper">
        <section class="login-card">
            <div class="brand">
                <img src="assets/kopken logo.svg" alt="Kopi Kenangan Logo" class="brand-logo">
                <div>
                    <p class="brand-name">Kopi Kenangan</p>
                    <p class="brand-subtitle">Login untuk dapatkan promo spesial</p>
                </div>
            </div>

            <h1>Masuk ke Akun</h1>

            <div class="ceo-section">
                <img src="assets/foto owner.jpg" alt="Edward Tirtanata, CEO dan Pendiri Kopi Kenangan" class="ceo-photo">
                <div class="ceo-content">
                    <blockquote class="ceo-quote">
                        "Di Kopi Kenangan, impian kami adalah menyajikan kopi berkualitas tinggi, yang dibuat dengan bahan-bahan lokal segar, kepada pelanggan di seluruh Indonesia – dan seluruh dunia."
                    </blockquote>
                    <p class="ceo-name">— Edward Tirtanata</p>
                    <p class="ceo-title">CEO dan Pendiri</p>
                </div>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">Email Gmail</label>
                    <input type="email" id="email" name="email" placeholder="nama@gmail.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Masukkan password" required>
                </div>

                <button type="submit" class="btn btn-primary">Masuk</button>
            </form>

            <div class="divider"><span>atau</span></div>

            <button type="button" class="btn btn-google" onclick="loginWithGoogle()">
                <img src="assets/google-icon.png" alt="Google"> Masuk dengan Google
            </button>
        </section>
    </main>
    <script src="script.js"></script>
</body>


</html></parameter>
